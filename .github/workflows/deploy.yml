name: Deploy

on:
  push:
    branches: [main, master]
  issues:
    types: [opened, edited, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  decide:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.gate.outputs.build }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Decide whether this issue event can change the site
        id: gate
        run: bun scripts/should-generate.ts

  build:
    needs: [decide]
    if: ${{ !cancelled() && (github.event_name != 'issues' || needs.decide.outputs.build == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache issue images
        uses: actions/cache@v4
        with:
          path: public/media
          key: issue-images-${{ github.repository }}-v1

      - name: Generate posts, build site, and index search
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun run build

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
